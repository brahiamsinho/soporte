<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <title>Perros y Gatos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
      #resultado {
        font-weight: bold;
        font-size: 6rem;
        text-align: center;
      }

      #estado {
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    
    <main>
      <div class="px-4 py-2 my-2 text-center border-bottom">
        <img class="d-block mx-auto mb-2" src="LogotipoV2-Simple.png" alt="" width="80" height="80">
        <h1 class="display-5 fw-bold">Perros y gatos</h1>
        <div class="col-lg-6 mx-auto">
          <p class="lead mb-0">Clasificaci&oacute;n de im&aacute;genes (Perro o Gato) usando la c&aacute;mara web utilizando Tensorflow.js</p>
          <p class="lead mb-4">Revisa <a href="">mi canal</a> para este y otros proyectos</p>
        </div>
      </div>

      <div class="b-example-divider"></div>

      <div class="container mt-5">
        <div class="row">
          <div class="col-12 col-md-4 offset-md-4 text-center">
            <video id="video" playsinline autoplay muted style="width: 1px;"></video>
            <button class="btn btn-primary mb-2" id="cambiar-camara" onclick="cambiarCamara();">Cambiar camara</button>
            <div id="estado" class="alert alert-info py-2" role="status" aria-live="polite">Iniciando...</div>
            <canvas id="canvas" width="400" height="400" style="max-width: 100%;"></canvas>
            <canvas id="otrocanvas" width="150" height="150" style="display: none"></canvas>
            <div id="resultado"></div>            
          </div>
        </div>
      </div>

      <div class="b-example-divider"></div>

      <div class="bg-dark text-secondary mt-5 px-4 py-2 text-center">
        <div class="py-5">
          <h1 class="display-5 fw-bold text-white">Soporte Toma Des</h1>
          <div class="col-lg-6 mx-auto">
            <p class="fs-5 mb-4">Revisa <a href="">mi canal</a> para videos de inteligencia artificial, programaci&oacute;n, etc.</p>
          </div>
        </div>
      </div>

      <div class="b-example-divider mb-0"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@2.0.0/dist/tf.min.js"></script>

  <script type="text/javascript">

    var tamano = 400;
    var video = document.getElementById("video");
    var canvas = document.getElementById("canvas");
    var otrocanvas = document.getElementById("otrocanvas");
    var ctx = canvas.getContext("2d");
    var estado = document.getElementById("estado");
    var currentStream = null;
    var facingMode = "user";
    var modelo = null;
    var modelLoadPromise = null;
    var cameraReady = false;
    var cameraRequestVersion = 0;
    var predictionStarted = false;

    function mostrarEstado(mensaje, esError) {
      estado.textContent = mensaje;
      estado.className = "alert " + (esError ? "alert-danger" : "alert-info") + " py-2";
    }

    function cargarModelo() {
      if (modelLoadPromise) return modelLoadPromise;

      mostrarEstado("Cargando modelo...", false);
      modelLoadPromise = tf.loadLayersModel("model.json", {
        onProgress: function(fraccion) {
          mostrarEstado("Cargando modelo... " + Math.round(fraccion * 100) + "%", false);
        }
      }).then(function(modeloCargado) {
        modelo = modeloCargado;
        mostrarEstado(cameraReady ? "Modelo y cámara listos." : "Modelo cargado. Esperando cámara...", false);
        return modelo;
      }).catch(function(error) {
        console.error("No se pudo cargar el modelo", error);
        mostrarEstado("No se pudo cargar el modelo: " + error.message, true);
        throw error;
      });
      return modelLoadPromise;
    }

    window.onload = function() {
      cargarModelo().catch(function() {});
      mostrarCamara();
      iniciarPrediccion();
    }

    function opcionesCamara() {
      return {
        audio: false,
        video: { facingMode: facingMode, width: tamano, height: tamano }
      };
    }

    function mostrarCamara() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        mostrarEstado("La cámara no está disponible en este navegador. Use un navegador moderno en localhost o HTTPS.", true);
        return;
      }

      var requestVersion = ++cameraRequestVersion;
      cameraReady = false;
      mostrarEstado("Solicitando permiso para usar la cámara...", false);
      navigator.mediaDevices.getUserMedia(opcionesCamara())
        .then(function(stream) {
          if (requestVersion !== cameraRequestVersion) {
            stream.getTracks().forEach(function(track) { track.stop(); });
            return null;
          }
          currentStream = stream;
          video.srcObject = stream;
          return video.play().then(function() { return stream; });
        })
        .then(function(stream) {
          if (!stream || requestVersion !== cameraRequestVersion) return;
          cameraReady = true;
          mostrarEstado(modelo ? "Modelo y cámara listos." : "Cámara lista. Cargando modelo...", false);
          procesarCamara();
        })
        .catch(function(error) {
          if (requestVersion !== cameraRequestVersion) return;
          console.error("No se pudo utilizar la cámara", error);
          mostrarEstado("No se pudo utilizar la cámara: " + error.message + ". Revise el permiso y que haya una cámara disponible.", true);
        });
    }

    function cambiarCamara() {
      if (currentStream) {
        currentStream.getTracks().forEach(function(track) { track.stop(); });
        currentStream = null;
      }
      facingMode = facingMode == "user" ? "environment" : "user";
      mostrarCamara();
    }

    function procesarCamara() {
      if (cameraReady && video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        ctx.drawImage(video, 0, 0, tamano, tamano, 0, 0, tamano, tamano);
      }
      if (cameraReady) setTimeout(procesarCamara, 20);
    }

    function iniciarPrediccion() {
      if (predictionStarted) return;
      predictionStarted = true;
      predecir();
    }

    function predecir() {
      if (modelo && cameraReady && video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        resample_single(canvas, 100, 100, otrocanvas);

        //Hacer la predicción
        var ctx2 = otrocanvas.getContext("2d");
        var imgData = ctx2.getImageData(0,0, 100, 100);

        var arr = [];
        var arr100 = [];

        for (var p=0; p < imgData.data.length; p+= 4) {
          var rojo = imgData.data[p] / 255;
          var verde = imgData.data[p+1] / 255;
          var azul = imgData.data[p+2] / 255;

          var gris = (rojo+verde+azul)/3;

          arr100.push([gris]);
          if (arr100.length == 100) {
            arr.push(arr100);
            arr100 = [];
          }
        }

        arr = [arr];

        var tensor = tf.tensor4d(arr);
        var salida = modelo.predict(tensor);
        var resultado = salida.dataSync();
        tensor.dispose();
        salida.dispose();

        var respuesta;
        if (resultado <= .5) {
          respuesta = "Gato";
        } else {
          respuesta = "Perro";
        }
        document.getElementById("resultado").textContent = respuesta;
      }

      setTimeout(predecir, 150);
    }

    /**
       * Hermite resize - fast image resize/resample using Hermite filter. 1 cpu version!
       * 
       * @param {HtmlElement} canvas
       * @param {int} width
       * @param {int} height
       * @param {boolean} resize_canvas if true, canvas will be resized. Optional.
       * Cambiado por RT, resize canvas ahora es donde se pone el chiqitillllllo
       */
      function resample_single(canvas, width, height, resize_canvas) {
          var width_source = canvas.width;
          var height_source = canvas.height;
          width = Math.round(width);
          height = Math.round(height);

          var ratio_w = width_source / width;
          var ratio_h = height_source / height;
          var ratio_w_half = Math.ceil(ratio_w / 2);
          var ratio_h_half = Math.ceil(ratio_h / 2);

          var ctx = canvas.getContext("2d");
          var ctx2 = resize_canvas.getContext("2d");
          var img = ctx.getImageData(0, 0, width_source, height_source);
          var img2 = ctx2.createImageData(width, height);
          var data = img.data;
          var data2 = img2.data;

          for (var j = 0; j < height; j++) {
              for (var i = 0; i < width; i++) {
                  var x2 = (i + j * width) * 4;
                  var weight = 0;
                  var weights = 0;
                  var weights_alpha = 0;
                  var gx_r = 0;
                  var gx_g = 0;
                  var gx_b = 0;
                  var gx_a = 0;
                  var center_y = (j + 0.5) * ratio_h;
                  var yy_start = Math.floor(j * ratio_h);
                  var yy_stop = Math.ceil((j + 1) * ratio_h);
                  for (var yy = yy_start; yy < yy_stop; yy++) {
                      var dy = Math.abs(center_y - (yy + 0.5)) / ratio_h_half;
                      var center_x = (i + 0.5) * ratio_w;
                      var w0 = dy * dy; //pre-calc part of w
                      var xx_start = Math.floor(i * ratio_w);
                      var xx_stop = Math.ceil((i + 1) * ratio_w);
                      for (var xx = xx_start; xx < xx_stop; xx++) {
                          var dx = Math.abs(center_x - (xx + 0.5)) / ratio_w_half;
                          var w = Math.sqrt(w0 + dx * dx);
                          if (w >= 1) {
                              //pixel too far
                              continue;
                          }
                          //hermite filter
                          weight = 2 * w * w * w - 3 * w * w + 1;
                          var pos_x = 4 * (xx + yy * width_source);
                          //alpha
                          gx_a += weight * data[pos_x + 3];
                          weights_alpha += weight;
                          //colors
                          if (data[pos_x + 3] < 255)
                              weight = weight * data[pos_x + 3] / 250;
                          gx_r += weight * data[pos_x];
                          gx_g += weight * data[pos_x + 1];
                          gx_b += weight * data[pos_x + 2];
                          weights += weight;
                      }
                  }
                  data2[x2] = gx_r / weights;
                  data2[x2 + 1] = gx_g / weights;
                  data2[x2 + 2] = gx_b / weights;
                  data2[x2 + 3] = gx_a / weights_alpha;
              }
          }


          ctx2.putImageData(img2, 0, 0);
      }
  </script>
  </body>
</html>
